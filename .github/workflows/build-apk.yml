name: Build Android APK

# Drop-in replacement for .github/workflows/build-apk.yml
#
# What changed vs. the original, and why:
#  1. Removed the "Install Capacitor" step. Capacitor is already declared in
#     package.json, so `npm install` covers it. The old step also ran
#     `npx cap init ... || true`, which silently swallowed errors - and could
#     rewrite capacitor.config.ts, discarding appId / androidScheme settings.
#  2. Java and the Android SDK are now set up BEFORE the Capacitor steps, so
#     every Gradle invocation uses the same JDK 17.
#  3. Dropped the obsolete `tools` package from the SDK list (`sdkmanager`
#     reports "Failed to find package 'tools'" for it).
#  4. Added an explicit check that out/index.html exists, so a broken Next.js
#     export fails with a readable message instead of a confusing Gradle error
#     much later in the run.
#  5. Added Gradle caching via gradle/actions/setup-gradle, which cuts several
#     minutes off every run after the first.
#  6. Removed `--info` from the Gradle call (it buries the real error in
#     thousands of lines) and kept `--stacktrace`.
#  7. `if-no-files-found: error` on the upload step, so the job can no longer
#     finish green with no APK attached.
#  8. Raised the job timeout to 40 minutes for the cold first build.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js (static export)
        env:
          # Baked into the bundle so "Check for updates" knows where to look.
          # Resolves to this repo's own committed catalogue on the default branch.
          NEXT_PUBLIC_CATALOG_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}/public/catalog.json
        run: npm run build

      - name: Verify static export exists
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html is missing - the Next.js static export did not run."
            echo "Check that next.config.js contains: output: 'export'"
            exit 1
          fi
          echo "Static export OK:"
          ls -la out/

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Add Android platform and sync
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android
          chmod +x android/gradlew
          echo "Android platform ready"
          ls -la android/

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Confirm APK was produced
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk \
            || { echo "::error::Gradle finished but app-debug.apk was not produced."; exit 1; }

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMatch-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 10
