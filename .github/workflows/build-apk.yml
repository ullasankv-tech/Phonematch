name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: |
          npm install
          echo "Dependencies installed successfully"

      - name: Build Next.js (static export)
        run: |
          npm run build
          echo "Next.js build completed"
          ls -la out/

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap init "PhoneMatch" "com.phonematch.app" --web-dir out || true
          echo "Capacitor packages ready"

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android
          echo "Android platform added and synced"
          ls -la android/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info --no-daemon
          echo "Gradle build finished"
          find . -name "*.apk" || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMatch-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 10
